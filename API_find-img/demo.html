<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logo Selection Workflow - Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 30px;
        }

        .progress-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 40px;
            position: relative;
        }

        .progress-bar::before {
            content: '';
            position: absolute;
            top: 20px;
            left: 0;
            right: 0;
            height: 2px;
            background: #e0e0e0;
            z-index: 0;
        }

        .step {
            text-align: center;
            z-index: 1;
            background: white;
            padding: 0 10px;
        }

        .step-circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 10px;
            font-weight: bold;
            color: #666;
        }

        .step.active .step-circle {
            background: #667eea;
            color: white;
        }

        .step.completed .step-circle {
            background: #4caf50;
            color: white;
        }

        .content-area {
            min-height: 400px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .item {
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: white;
        }

        .item:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border-color: #667eea;
        }

        .item.selected {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .item img {
            max-width: 100%;
            height: 150px;
            object-fit: contain;
            margin-bottom: 10px;
        }

        .color-box {
            width: 100%;
            height: 100px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
        }

        button:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        .info-box {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #2196f3;
        }

        .error-box {
            background: #ffebee;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #f44336;
            color: #c62828;
        }

        .success-box {
            background: #e8f5e9;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #4caf50;
            color: #2e7d32;
        }

        pre {
            background: #263238;
            color: #aed581;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 14px;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .layout-item {
            position: relative;
        }

        .layout-item input[type="checkbox"] {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        h2 {
            color: #333;
            margin-bottom: 15px;
        }

        .step-label {
            font-size: 14px;
            color: #666;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 Logo Selection Workflow</h1>
        
        <div class="progress-bar">
            <div class="step" id="step-logo">
                <div class="step-circle">1</div>
                <div class="step-label">Logo</div>
            </div>
            <div class="step" id="step-color">
                <div class="step-circle">2</div>
                <div class="step-label">Màu sắc</div>
            </div>
            <div class="step" id="step-background">
                <div class="step-circle">3</div>
                <div class="step-label">Background</div>
            </div>
            <div class="step" id="step-layout">
                <div class="step-circle">4</div>
                <div class="step-label">Layout</div>
            </div>
        </div>

        <div id="message-area"></div>

        <div class="content-area" id="content-area">
            <div class="loading">
                <div class="spinner"></div>
                <p>Click "Bắt đầu" để khởi tạo workflow...</p>
            </div>
        </div>

        <div class="button-group">
            <button onclick="startWorkflow()" id="start-btn">Bắt đầu</button>
            <button onclick="nextStep()" id="next-btn" disabled>Tiếp theo</button>
            <button onclick="resetWorkflow()" id="reset-btn" disabled>Reset</button>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:3000/api/workflow';
        let sessionId = null;
        let currentStep = null;
        let currentData = null;
        let selectedItem = null;
        let selectedLayouts = new Set();

        const chatbotOutput = {
            session_id: "demo-" + Date.now(),
            dealer_id: "0986899001",
            brand_name_full: "Nhôm kính An Phát",
            location: "212 Quang Trung, Hà Đông, Hà Nội",
            main_products: ["cửa nhôm", "cửa kính", "cửa cuốn"],
            slogan: "An Phát – Uy Tín Kiến Tạo, Chất Lượng Dẫn Đầu.",
            logo_style: ["Hiện đại (Modern Geometric)"],
            main_color: ["xanh dương"]
        };

        async function startWorkflow() {
            try {
                showLoading();
                const response = await fetch(`${API_BASE}/initialize`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(chatbotOutput)
                });

                const data = await response.json();
                if (data.success) {
                    sessionId = data.data.sessionId;
                    currentStep = 'logo';
                    currentData = data.data;
                    displayLogos(data.data.logos, data.data.category);
                    updateProgress('logo');
                    showMessage(`✅ Đã khởi tạo session. Hệ thống phát hiện category: ${data.data.category}`, 'info');
                    document.getElementById('start-btn').disabled = true;
                    document.getElementById('reset-btn').disabled = false;
                }
            } catch (error) {
                showMessage('❌ Lỗi: ' + error.message, 'error');
            }
        }

        async function nextStep() {
            if (!selectedItem && currentStep !== 'layout') {
                showMessage('⚠️ Vui lòng chọn một item trước khi tiếp tục', 'error');
                return;
            }

            if (currentStep === 'layout' && selectedLayouts.size === 0) {
                showMessage('⚠️ Vui lòng chọn ít nhất một layout', 'error');
                return;
            }

            try {
                showLoading();
                let response;

                if (currentStep === 'logo') {
                    response = await fetch(`${API_BASE}/${sessionId}/logo`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(selectedItem)
                    });
                } else if (currentStep === 'color') {
                    response = await fetch(`${API_BASE}/${sessionId}/color`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(selectedItem)
                    });
                } else if (currentStep === 'background') {
                    response = await fetch(`${API_BASE}/${sessionId}/background`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(selectedItem)
                    });
                } else if (currentStep === 'layout') {
                    response = await fetch(`${API_BASE}/${sessionId}/layout`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ layouts: Array.from(selectedLayouts) })
                    });
                }

                const data = await response.json();
                if (data.success) {
                    currentData = data.data;
                    selectedItem = null;

                    if (currentStep === 'logo') {
                        currentStep = 'color';
                        displayColors(data.data.colors);
                        updateProgress('color');
                    } else if (currentStep === 'color') {
                        currentStep = 'background';
                        displayBackgrounds(data.data.backgrounds);
                        updateProgress('background');
                    } else if (currentStep === 'background') {
                        currentStep = 'layout';
                        displayLayouts(data.data.layouts);
                        updateProgress('layout');
                    } else if (currentStep === 'layout') {
                        displayFinalResult(data.data);
                        showMessage('🎉 Workflow hoàn tất!', 'success');
                        document.getElementById('next-btn').disabled = true;
                    }
                }
            } catch (error) {
                showMessage('❌ Lỗi: ' + error.message, 'error');
            }
        }

        function displayLogos(logos, category) {
            const content = `
                <h2>📁 Chọn Logo - Category: ${category}</h2>
                <div class="info-box">Có ${logos.length} logo available. Click để chọn.</div>
                <div class="grid">
                    ${logos.map(logo => `
                        <div class="item" onclick="selectLogo('${logo.id}', '${logo.category}', ${logo.variant})">
                            <img src="${logo.url}" alt="${logo.name}" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22><rect width=%22200%22 height=%22200%22 fill=%22%23ddd%22/><text x=%2250%%22 y=%2250%%22 text-anchor=%22middle%22 dy=%22.3em%22 font-family=%22Arial%22 font-size=%2216%22>${logo.name}</text></svg>'">
                            <div><strong>${logo.name}</strong></div>
                        </div>
                    `).join('')}
                </div>
            `;
            document.getElementById('content-area').innerHTML = content;
            document.getElementById('next-btn').disabled = true;
        }

        function selectLogo(id, category, variant) {
            document.querySelectorAll('.item').forEach(el => el.classList.remove('selected'));
            event.currentTarget.classList.add('selected');
            selectedItem = { logoId: id, category, variant };
            document.getElementById('next-btn').disabled = false;
        }

        function displayColors(colors) {
            const content = `
                <h2>🎨 Chọn Màu Sắc</h2>
                <div class="info-box">Có ${colors.length} màu available. Click để chọn.</div>
                <div class="grid">
                    ${colors.map(color => `
                        <div class="item" onclick="selectColor('${color.color}', '${color.url}')">
                            <div class="color-box" style="background: ${getColorValue(color.color)}"></div>
                            <div><strong>${color.color.toUpperCase()}</strong></div>
                        </div>
                    `).join('')}
                </div>
            `;
            document.getElementById('content-area').innerHTML = content;
            document.getElementById('next-btn').disabled = true;
        }

        function selectColor(color, url) {
            document.querySelectorAll('.item').forEach(el => el.classList.remove('selected'));
            event.currentTarget.classList.add('selected');
            selectedItem = { color, colorUrl: url };
            document.getElementById('next-btn').disabled = false;
        }

        function displayBackgrounds(backgrounds) {
            const content = `
                <h2>🖼️ Chọn Background</h2>
                <div class="info-box">Có ${backgrounds.length} backgrounds available. Click để chọn.</div>
                <div class="grid">
                    ${backgrounds.map(bg => `
                        <div class="item" onclick="selectBackground('${bg.id}', '${bg.type}', '${bg.value}')">
                            ${bg.type === 'color' 
                                ? `<div class="color-box" style="background: ${bg.value}"></div>`
                                : `<img src="${bg.value}" alt="${bg.name}" onerror="this.style.display='none'">`
                            }
                            <div><strong>${bg.name || bg.id}</strong></div>
                            <div><small>${bg.type}</small></div>
                        </div>
                    `).join('')}
                </div>
            `;
            document.getElementById('content-area').innerHTML = content;
            document.getElementById('next-btn').disabled = true;
        }

        function selectBackground(id, type, value) {
            document.querySelectorAll('.item').forEach(el => el.classList.remove('selected'));
            event.currentTarget.classList.add('selected');
            selectedItem = { backgroundId: id, type, value };
            document.getElementById('next-btn').disabled = false;
        }

        function displayLayouts(layouts) {
            const content = `
                <h2>📐 Chọn Layout(s)</h2>
                <div class="info-box">Có ${layouts.length} layouts available. Có thể chọn nhiều layouts.</div>
                <div class="grid">
                    ${layouts.map(layout => `
                        <div class="item layout-item" onclick="toggleLayout('${layout.id}')">
                            <input type="checkbox" id="check-${layout.id}" onclick="event.stopPropagation()">
                            <img src="${layout.thumbnail || layout.url}" alt="${layout.name}" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22><rect width=%22200%22 height=%22200%22 fill=%22%23ddd%22/><text x=%2250%%22 y=%2250%%22 text-anchor=%22middle%22 dy=%22.3em%22 font-family=%22Arial%22 font-size=%2216%22>${layout.name}</text></svg>'">
                            <div><strong>${layout.name}</strong></div>
                            <div><small>${layout.type}</small></div>
                        </div>
                    `).join('')}
                </div>
            `;
            document.getElementById('content-area').innerHTML = content;
            document.getElementById('next-btn').disabled = true;
        }

        function toggleLayout(id) {
            const checkbox = document.getElementById(`check-${id}`);
            checkbox.checked = !checkbox.checked;
            
            if (checkbox.checked) {
                selectedLayouts.add(id);
                event.currentTarget.classList.add('selected');
            } else {
                selectedLayouts.delete(id);
                event.currentTarget.classList.remove('selected');
            }

            document.getElementById('next-btn').disabled = selectedLayouts.size === 0;
        }

        function displayFinalResult(data) {
            const content = `
                <h2>✅ Kết Quả Cuối Cùng</h2>
                <div class="success-box">
                    <strong>🎉 Workflow hoàn tất!</strong><br>
                    Brief ID: ${data.briefId}<br>
                    Session ID: ${data.sessionId}<br>
                    Số layouts: ${data.assetsToExport.length}
                </div>
                <h3>JSON Output:</h3>
                <pre>${JSON.stringify(data, null, 2)}</pre>
            `;
            document.getElementById('content-area').innerHTML = content;
        }

        function updateProgress(step) {
            const steps = ['logo', 'color', 'background', 'layout'];
            const currentIndex = steps.indexOf(step);

            steps.forEach((s, i) => {
                const element = document.getElementById(`step-${s}`);
                element.classList.remove('active', 'completed');
                
                if (i < currentIndex) {
                    element.classList.add('completed');
                } else if (i === currentIndex) {
                    element.classList.add('active');
                }
            });
        }

        function showMessage(message, type) {
            const messageArea = document.getElementById('message-area');
            const className = type === 'error' ? 'error-box' : type === 'success' ? 'success-box' : 'info-box';
            messageArea.innerHTML = `<div class="${className}">${message}</div>`;
            setTimeout(() => messageArea.innerHTML = '', 5000);
        }

        function showLoading() {
            document.getElementById('content-area').innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Đang xử lý...</p>
                </div>
            `;
        }

        function resetWorkflow() {
            if (confirm('Bạn có chắc muốn reset workflow?')) {
                location.reload();
            }
        }

        function getColorValue(colorName) {
            const colors = {
                blue: '#2196F3',
                brown: '#795548',
                gold: '#FFD700',
                green: '#4CAF50',
                original: '#9E9E9E',
                purple: '#9C27B0',
                red: '#F44336',
                silver: '#C0C0C0',
                yellow: '#FFEB3B'
            };
            return colors[colorName] || '#ccc';
        }
    </script>
</body>
</html>
